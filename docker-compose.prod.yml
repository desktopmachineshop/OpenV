# Production overrides for docker-compose.yml. Never used alone — always
# layered on top of the dev file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required variables (put them in a .env file next to the compose files —
# docker compose reads it automatically; see docs/operations.md):
#
#   POSTGRES_PASSWORD   database password (replaces the dev default)
#   CORS_ORIGIN         public origin the frontend is served from,
#                       e.g. https://openv.example.com
#   WORKER_API_KEY      shared key host/hosted agent workers use to
#                       authenticate (replaces the dev "dev-worker-key")
#
# Optional:
#   FRONTEND_PORT       host port for the frontend (default 80)
#   REACT_APP_API_URL   only for a split deployment where browsers reach the
#                       API on its own origin (e.g. https://openv.example.com:8080).
#                       Leave it unset: the frontend's nginx proxies /api/ to
#                       the api service, so the browser sees one origin and
#                       the session cookie is first-party (works on iOS).
#   PUBLIC_URL / FRONTEND_URL / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#                       for Google sign-in (see docker-compose.yml)
#
# Memory limits below use mem_limit, which plain (non-swarm) docker compose
# enforces. Hosted-runner containers provisioned by the API
# (internal/hosting/docker.go) are created outside compose but do get their own
# Memory / NanoCPUs caps applied from the runner limits — see docs/operations.md.

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Keep Postgres reachable only from the compose network in production;
    # backups go through `make backup`, which execs into the container.
    ports: !override []
    mem_limit: 1g

  api:
    restart: unless-stopped
    # Hosted runners (only if you enable them — see the socket warning in
    # docs/operations.md) are created on the openv-runners network below, and
    # the API joins it so they can reach it. Postgres does not, so a runner
    # container has no route to the database.
    networks:
      - default
      - openv-runners
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Which network the API attaches hosted runner containers to. Leaving it
      # unset drops them on the default bridge with every other container.
      RUNNER_NETWORK: ${RUNNER_NETWORK:-openv-runners}
      # Processes one runner container may create (fork-bomb ceiling).
      # 0 = no cap; unset = 256.
      HOSTED_RUNNER_PIDS_LIMIT: ${HOSTED_RUNNER_PIDS_LIMIT:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env (e.g. https://openv.example.com)}
      # Without this, docker-compose.yml falls back to "dev-worker-key" —
      # never acceptable in production, so make it required here.
      WORKER_API_KEY: ${WORKER_API_KEY:?set WORKER_API_KEY in .env (long random string; workers authenticate with it)}
    healthcheck:
      # /health is unauthenticated (internal/api/authmiddleware.go); the API
      # image is alpine-based, so busybox wget is available.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the static bundle at build time — changing it requires
        # a rebuild (`up -d --build`). Empty = same-origin /api/ (proxied).
        - REACT_APP_API_URL=${REACT_APP_API_URL:-}
    # Dockerfile.prod serves the static build with nginx on container port
    # 8080; !override replaces the dev "3000:3000" mapping instead of
    # merging with it.
    ports: !override
      - "${FRONTEND_PORT:-80}:8080"
    environment:
      # Where nginx proxies /api/ to: the api service on the compose network.
      # Read at container start (frontend/docker-entrypoint.d/).
      - API_UPSTREAM=api:8080
      # Irrelevant at run time (baked in at build); overridden so `docker
      # inspect` doesn't show a misleading dev value.
      - REACT_APP_API_URL=${REACT_APP_API_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m

# The network hosted runner containers are attached to (RUNNER_NETWORK above).
# Only the api service joins it, so a runner reaches the API and — because a
# bridge network has egress — the provider endpoints, and nothing else of
# yours: not Postgres, not the frontend, not another workspace's services.
#
# Egress itself is deliberately open here, since that is how the vendor CLIs
# reach api.anthropic.com and friends. Narrowing it to the provider hostnames
# is a host firewall or proxy job — docker networking cannot express it. See
# docs/operations.md, "Hosted runners: the docker socket, and how to avoid it".
networks:
  openv-runners:
    name: ${RUNNER_NETWORK:-openv-runners}
