# Release pipeline: Railway deploys the `release` branch, not master
# (docs/railway.md#release-pipeline). Merges to master therefore never touch
# the live product. To ship what's on master, run this workflow from the
# Actions tab — it fast-forwards `release` to master, and Railway's GitHub
# integration picks up the push and deploys.
#
# Guard rails:
# - refuses to promote if any workflow this repository defines is failing or
#   still running on the master head, or any check posted by another app is
#   (master's own CI gates every promotion). Dependabot's updater jobs are
#   not among them — see the step for why a bot's housekeeping must not hold
#   up a release, and how they are told apart.
# - every release says what changed: the Unreleased bullets of
#   RELEASE_NOTES.md are cut into a new version section (committed to master
#   by this workflow), and a master whose notes name nothing newer than what
#   `release` already carries is refused (scripts/release_notes.py)
# - a release that carries a security fix is also designated the stable
#   release in the same push (REQ-142)
# - the push is a plain fast-forward; if `release` somehow has commits that
#   master lacks, the push is rejected instead of overwriting them
# - the shipped commit is tagged `v<version>`, so a release is a point in
#   history you can check out and compare against rather than only a branch
#   position and a notes section
# - the user manual ships with the code: master's Docs check (OpenD
#   validates manual/) is among the checks that must be green, the release
#   commit stamps the manual's `release:` with the version's line, and the
#   shipped commit is pushed to `docs/<major.minor>`, the branch the docs
#   site publishes that line from (docs/docs-maintenance.md)

name: Promote to release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Cut a major release (1.0.0). Otherwise the version is derived from the notes: a new feature is a minor bump, maintenance and fixes a patch."
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

jobs:
  promote:
    name: Fast-forward release to master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify master CI is green
        env:
          GH_TOKEN: ${{ github.token }}
          # This workflow's own run is attached to the master head too (in
          # progress now; failed or succeeded from earlier attempts), so it
          # must be excluded or promotion can never pass.
          SELF_PATH: .github/workflows/promote-release.yml
        run: |
          sha=$(git rev-parse HEAD)
          echo "Promoting master commit $sha"

          # Judge the commit by the workflows *this repository* defines.
          #
          # Dependabot's updater jobs attach check runs to the head as well,
          # and they go red whenever a flagged package has no upgrade path —
          # a standing fact about the dependency tree that no release can
          # change and none should wait on. They cannot be told apart by app
          # (GitHub Actions runs them, like everything else here) or safely by
          # name, but they do not come from this repository: their workflow
          # path is `dynamic/dependabot/dependabot-updates`, not
          # `.github/workflows/`. That is the distinction the gate uses.
          #
          # Whether the dependencies themselves are sound is gated separately,
          # by the Vulnerability scan job in ci.yml, which runs on master like
          # every other check here.
          #
          # per_page covers a head with more checks than the API's default
          # page of 30 — silently judging only the first 30 of a longer list
          # would be worse than refusing outright.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" > /tmp/runs.json
          jq --arg self "$SELF_PATH" \
            '[.workflow_runs[]
              | select(.path | startswith(".github/workflows/"))
              | select(.path != $self)
              | {name, status, conclusion}]' /tmp/runs.json > /tmp/judging-runs.json

          # Checks posted by other apps — code scanning, for one — are check
          # runs rather than workflow runs, so they are collected separately.
          # GitHub Actions' own check runs are already covered above, and
          # counting them twice would just repeat the same verdict.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" > /tmp/check-runs.json
          jq '[.check_runs[]
                | select((.app.slug // "") != "github-actions")
                | {name, status, conclusion}]' /tmp/check-runs.json > /tmp/judging-checks.json

          jq -s 'add' /tmp/judging-runs.json /tmp/judging-checks.json > /tmp/judging.json
          echo "Judging this commit by: $(jq -r 'map(.name) | join(", ")' /tmp/judging.json)"
          if [ "$(jq 'length' /tmp/judging.json)" = "0" ]; then
            echo "No checks found on master head — refusing to promote." >&2
            exit 1
          fi

          # Anything not finished counts as not green, so promotion waits for
          # a run still going rather than racing it.
          not_green=$(jq -r '[.[]
            | select(.status != "completed"
                     or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))]
            | map(.name) | join(", ")' /tmp/judging.json)
          if [ -n "$not_green" ]; then
            echo "Checks not green on master head: $not_green" >&2
            exit 1
          fi

      # The API announces the release named by the top section of
      # RELEASE_NOTES.md, so every promotion must carry one that is new. The
      # usual case: pull requests left bullets under Unreleased, and they are
      # cut here into a new version section — the version derived from what
      # the bullets are (a new feature is a minor bump, maintenance and fixes
      # a patch, a major one asked for above) — and committed to master
      # first, so master and release stay identical. A maintainer who cut the
      # notes by hand leaves Unreleased empty and the check below still
      # passes; a master with nothing new to say is refused.
      - name: Cut the release notes
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          git fetch --no-tags --depth=1 origin release || true
          git show origin/release:RELEASE_NOTES.md > /tmp/released-notes.md 2>/dev/null || : > /tmp/released-notes.md
          major=""
          if [ "$MAJOR" = "true" ]; then major="--major"; fi
          if python3 scripts/release_notes.py cut $major RELEASE_NOTES.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python3 scripts/release_notes.py site RELEASE_NOTES.md
            git add RELEASE_NOTES.md frontend/src/site/changelog/releases.json
            git commit -m "Release $(python3 scripts/release_notes.py version RELEASE_NOTES.md)"
          fi
          python3 scripts/release_notes.py check-release --released /tmp/released-notes.md RELEASE_NOTES.md

      # A release that carries a security fix becomes the stable release in
      # this same promotion, so stable-channel workspaces are told about it
      # today rather than at next month's cut, and it costs no second build
      # (REQ-142, docs/release-policy.md). Any other release is left to the
      # monthly cut; the script says so and changes nothing.
      - name: Make a security fix the stable release
        run: |
          before=$(python3 scripts/release_notes.py stable-version RELEASE_NOTES.md)
          python3 scripts/release_notes.py cut-stable --if-security RELEASE_NOTES.md
          after=$(python3 scripts/release_notes.py stable-version RELEASE_NOTES.md)
          if [ "$before" != "$after" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python3 scripts/release_notes.py site RELEASE_NOTES.md
            git add RELEASE_NOTES.md frontend/src/site/changelog/releases.json
            git commit -m "Stable release $after (security fix)"
          fi

      # The manual on master describes master, so the release commit names
      # the line it now documents: 0.24 for 0.24.0 and every 0.24.x after.
      # A patch release leaves it as it is.
      - name: Stamp the manual's release line
        run: |
          python3 scripts/manual/docs.py stamp RELEASE_NOTES.md manual/opend.config.yaml
          if ! git diff --quiet -- manual/opend.config.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manual/opend.config.yaml
            git commit -m "Manual documents $(python3 scripts/manual/docs.py line RELEASE_NOTES.md)"
          fi

      - name: Push release
        run: |
          git push origin HEAD:master
          git push origin HEAD:release

      # Tag what shipped. Without this a release is only a branch position
      # and a section of RELEASE_NOTES.md: you cannot check one out, compare
      # two of them, or point at one from an incident — and `release` itself
      # only ever shows the newest.
      #
      # After the push, deliberately: a tag should exist only for a release
      # that actually shipped, and the push is the step that can still be
      # rejected. Annotated so it carries when it was cut and by what.
      - name: Tag the release
        run: |
          version=$(python3 scripts/release_notes.py version RELEASE_NOTES.md)
          if [ -z "$version" ]; then
            echo "No version in the notes to tag." >&2
            exit 1
          fi
          tag="v${version}"

          # A promotion that re-ships a version someone cut by hand, or a
          # re-run of this job, must not fail here: the release is already
          # out by this point, and a red workflow would say otherwise.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::warning::${tag} already exists on origin; leaving it as it is."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "OpenV $version"
          git push origin "refs/tags/${tag}"
          echo "Tagged $(git rev-parse --short HEAD) as ${tag}"
          echo "Tagged \`${tag}\` at \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # The docs site publishes each minor line from its own branch, so a
      # workspace on 0.22 keeps the 0.22 manual while nightly reads 0.24.
      # The branch follows the newest release of its line: a patch release
      # moves it on. Forced, because a docs fix backported to the line
      # (docs/docs-maintenance.md) is a cherry-pick of a master commit this
      # release already carries, so moving past it loses nothing. Like the
      # tag, after the push: only a release that shipped gets its docs.
      - name: Publish the manual's release line
        run: |
          line=$(python3 scripts/manual/docs.py line RELEASE_NOTES.md)
          git push --force origin "HEAD:refs/heads/docs/${line}"
          echo "Manual for ${line} published from \`docs/${line}\` at \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # openv.app's production builds openv-hosted's `release` branch, which
      # pins the OpenV release it runs (its OPENV_VERSION; docs/railway.md
      # "openv-hosted"). Pointing it
      # at the tag just made is what ships the release there: a pull request
      # this step merges once openv-hosted's CI passes, and Railway deploys
      # the merge. It waits for that CI itself: GitHub's auto-merge is not
      # offered for a private repository on the free plan. A red CI leaves
      # the pull request open and fails the step. Without the
      # OPENV_HOSTED_TOKEN secret (a token that may push to openv-hosted and
      # open pull requests there) the step says so and does nothing; the
      # release is still tagged.
      - name: Ship the release to openv.app (openv-hosted)
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.OPENV_HOSTED_TOKEN }}
          HOSTED_REPO: desktopmachineshop/openv-hosted
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::OPENV_HOSTED_TOKEN is not set: openv-hosted was not pointed at this release; set its OPENV_VERSION by hand."
            exit 0
          fi
          tag="v$(python3 scripts/release_notes.py version RELEASE_NOTES.md)"
          branch="openv-${tag}"
          dir="$(mktemp -d)"
          git clone --quiet --depth 1 --branch release "https://x-access-token:${GH_TOKEN}@github.com/${HOSTED_REPO}.git" "$dir"
          cd "$dir"
          if [ "$(tr -d ' \n' < OPENV_VERSION)" = "$tag" ]; then
            echo "openv-hosted already runs ${tag}."
            exit 0
          fi
          git checkout --quiet -b "$branch"
          echo "$tag" > OPENV_VERSION
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "Run OpenV ${tag}"
          git push --quiet --force origin "$branch"
          url=$(gh pr create --repo "$HOSTED_REPO" --base release --head "$branch" \
            --title "Run OpenV ${tag}" \
            --body "OpenV's *Promote to release* tagged ${tag}; this points openv.app at it. The promotion merges it once CI passes, and Railway deploys the merge.")
          # The checks take a moment to register; gh pr checks fails while
          # there are none.
          for _ in $(seq 30); do
            gh pr checks --repo "$HOSTED_REPO" "$url" >/dev/null 2>&1 && break
            [ "$?" -eq 8 ] && break
            sleep 10
          done
          if ! gh pr checks --repo "$HOSTED_REPO" "$url" --watch --fail-fast --interval 20; then
            echo "::error::openv-hosted's CI failed on ${url}: openv.app still runs the previous release. Fix it there and merge the pull request by hand."
            echo "openv-hosted: ${url}, CI failed, not merged" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh pr merge --repo "$HOSTED_REPO" --merge "$url"
          gh api -X DELETE "repos/${HOSTED_REPO}/git/refs/heads/${branch}" >/dev/null || true
          echo "openv-hosted: ${url}, merged; Railway deploys it" >> "$GITHUB_STEP_SUMMARY"
