# Release pipeline: Railway deploys the `release` branch, not master
# (docs/railway.md#release-pipeline). Merges to master therefore never touch
# the live product. To ship what's on master, run this workflow from the
# Actions tab — it fast-forwards `release` to master, and Railway's GitHub
# integration picks up the push and deploys.
#
# Guard rails:
# - refuses to promote if any check run on the master head is failing or
#   still in progress (master's own CI gates every promotion)
# - every release says what changed: the Unreleased bullets of
#   RELEASE_NOTES.md are cut into a dated section (committed to master by
#   this workflow), and a master whose notes name nothing newer than what
#   `release` already carries is refused (scripts/release_notes.py)
# - the push is a plain fast-forward; if `release` somehow has commits that
#   master lacks, the push is rejected instead of overwriting them

name: Promote to release

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  promote:
    name: Fast-forward release to master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify master CI is green
        env:
          GH_TOKEN: ${{ github.token }}
          # This promote job itself appears as a check run on the master head
          # (in progress now; failed/succeeded from earlier attempts), so it
          # must be excluded from the gate or promotion can never pass.
          SELF: Fast-forward release to master
        run: |
          sha=$(git rev-parse HEAD)
          echo "Promoting master commit $sha"
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
            --jq '[.check_runs[] | select(.name != env.SELF)] | length')
          if [ "$runs" = "0" ]; then
            echo "No check runs found on master head — refusing to promote." >&2
            exit 1
          fi
          not_green=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
            --jq '[.check_runs[] | select(.name != env.SELF) | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | map(.name) | join(", ")')
          if [ -n "$not_green" ]; then
            echo "Checks not green on master head: $not_green" >&2
            exit 1
          fi

      # The API announces the release named by the top dated section of
      # RELEASE_NOTES.md, so every promotion must carry one that is new. The
      # usual case: pull requests left bullets under Unreleased, and they are
      # cut here into today's section (2026-09-12, then 2026-09-12.2 for a
      # second release that day) and committed to master first, so master
      # and release stay identical. A maintainer who cut the notes by hand
      # leaves Unreleased empty and the check below still passes; a master
      # with nothing new to say is refused.
      - name: Cut the release notes
        run: |
          git fetch --no-tags --depth=1 origin release || true
          git show origin/release:RELEASE_NOTES.md > /tmp/released-notes.md 2>/dev/null || : > /tmp/released-notes.md
          if python3 scripts/release_notes.py cut RELEASE_NOTES.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RELEASE_NOTES.md
            git commit -m "Cut release notes $(python3 scripts/release_notes.py version RELEASE_NOTES.md)"
          fi
          python3 scripts/release_notes.py check-release --released /tmp/released-notes.md RELEASE_NOTES.md

      - name: Push release
        run: |
          git push origin HEAD:master
          git push origin HEAD:release
