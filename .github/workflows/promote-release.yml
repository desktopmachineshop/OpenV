# Release pipeline: Railway deploys the `release` branch, not master
# (docs/railway.md#release-pipeline). Merges to master therefore never touch
# the live product. To ship what's on master, run this workflow from the
# Actions tab — it fast-forwards `release` to master, and Railway's GitHub
# integration picks up the push and deploys.
#
# Guard rails:
# - refuses to promote if any check run that judges the master head is
#   failing or still in progress (master's own CI gates every promotion).
#   Dependabot's own updater check is not one of those — see the step for
#   why a bot's housekeeping must not hold up a release.
# - every release says what changed: the Unreleased bullets of
#   RELEASE_NOTES.md are cut into a new version section (committed to master
#   by this workflow), and a master whose notes name nothing newer than what
#   `release` already carries is refused (scripts/release_notes.py)
# - the push is a plain fast-forward; if `release` somehow has commits that
#   master lacks, the push is rejected instead of overwriting them
# - the shipped commit is tagged `v<version>`, so a release is a point in
#   history you can check out and compare against rather than only a branch
#   position and a notes section

name: Promote to release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Cut a major release (1.0.0). Otherwise the version is derived from the notes: a new feature is a minor bump, maintenance and fixes a patch."
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

jobs:
  promote:
    name: Fast-forward release to master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify master CI is green
        env:
          GH_TOKEN: ${{ github.token }}
          # This promote job itself appears as a check run on the master head
          # (in progress now; failed/succeeded from earlier attempts), so it
          # must be excluded from the gate or promotion can never pass.
          SELF: Fast-forward release to master
        run: |
          sha=$(git rev-parse HEAD)
          echo "Promoting master commit $sha"
          # Read once, so the count and the verdict cannot disagree about a
          # check that changed between the two calls, and ask for a full page:
          # the default is 30, and silently judging only the first 30 checks
          # of a longer list would be worse than refusing outright.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" > /tmp/check-runs.json
          # Dependabot's check run says whether its own updater could compute
          # an update. It goes red when a vulnerable transitive dependency has
          # no fix path — a standing fact about the dependency tree that no
          # release can change and none should wait on. This gate asks whether
          # *this commit* is sound, so judge it by the checks that examined
          # it. The dependency tree has its own gate: the Vulnerability scan
          # job in ci.yml, which runs on master like everything else here.
          jq --arg self "$SELF" \
            '[.check_runs[] | select(.name != $self and (.app.slug // "") != "dependabot")]' \
            /tmp/check-runs.json > /tmp/judging.json
          echo "Judging this commit by: $(jq -r 'map(.name) | join(", ")' /tmp/judging.json)"
          if [ "$(jq 'length' /tmp/judging.json)" = "0" ]; then
            echo "No check runs found on master head — refusing to promote." >&2
            exit 1
          fi
          # A check still running has a null conclusion, so it counts as not
          # green too: promotion waits for it rather than racing it.
          not_green=$(jq -r '[.[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | map(.name) | join(", ")' /tmp/judging.json)
          if [ -n "$not_green" ]; then
            echo "Checks not green on master head: $not_green" >&2
            exit 1
          fi

      # The API announces the release named by the top section of
      # RELEASE_NOTES.md, so every promotion must carry one that is new. The
      # usual case: pull requests left bullets under Unreleased, and they are
      # cut here into a new version section — the version derived from what
      # the bullets are (a new feature is a minor bump, maintenance and fixes
      # a patch, a major one asked for above) — and committed to master
      # first, so master and release stay identical. A maintainer who cut the
      # notes by hand leaves Unreleased empty and the check below still
      # passes; a master with nothing new to say is refused.
      - name: Cut the release notes
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          git fetch --no-tags --depth=1 origin release || true
          git show origin/release:RELEASE_NOTES.md > /tmp/released-notes.md 2>/dev/null || : > /tmp/released-notes.md
          major=""
          if [ "$MAJOR" = "true" ]; then major="--major"; fi
          if python3 scripts/release_notes.py cut $major RELEASE_NOTES.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RELEASE_NOTES.md
            git commit -m "Release $(python3 scripts/release_notes.py version RELEASE_NOTES.md)"
          fi
          python3 scripts/release_notes.py check-release --released /tmp/released-notes.md RELEASE_NOTES.md

      - name: Push release
        run: |
          git push origin HEAD:master
          git push origin HEAD:release

      # Tag what shipped. Without this a release is only a branch position
      # and a section of RELEASE_NOTES.md: you cannot check one out, compare
      # two of them, or point at one from an incident — and `release` itself
      # only ever shows the newest.
      #
      # After the push, deliberately: a tag should exist only for a release
      # that actually shipped, and the push is the step that can still be
      # rejected. Annotated so it carries when it was cut and by what.
      - name: Tag the release
        run: |
          version=$(python3 scripts/release_notes.py version RELEASE_NOTES.md)
          if [ -z "$version" ]; then
            echo "No version in the notes to tag." >&2
            exit 1
          fi
          tag="v${version}"

          # A promotion that re-ships a version someone cut by hand, or a
          # re-run of this job, must not fail here: the release is already
          # out by this point, and a red workflow would say otherwise.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::warning::${tag} already exists on origin; leaving it as it is."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "OpenV $version"
          git push origin "refs/tags/${tag}"
          echo "Tagged $(git rev-parse --short HEAD) as ${tag}"
          echo "Tagged \`${tag}\` at \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
