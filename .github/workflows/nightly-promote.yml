# Nightly promotion (docs/release-policy.md, REQ-135, REQ-141): once a
# staging environment exists, every night at 03:00 UTC a green master with
# new release notes is smoke-tested on staging and, if it passes, promoted
# to `release` by the Promote to release workflow.
#
# This workflow is a no-op until the repository variable STAGING_BASE_URL is
# set, and that variable is what ARMS AUTOMATIC PROMOTION — setting it means
# a green master goes to production without anyone asking. It is deliberately
# unset today: promotions are batched and human-initiated (CLAUDE.md). The
# separate staging-smoke.yml runs the same journey on every merge and only
# reports, which is what staging is for meanwhile; it reads STAGING_URL, a
# different variable, precisely so that smoke-testing staging cannot arm this.
#
# Staging has public sign-up closed (REQ-141), so the smoke suite signs in as
# a pre-provisioned account: repository variable SMOKE_EMAIL and repository
# secret SMOKE_PASSWORD. Staging also wants OPENV_AUTH_ACCOUNT_BURST raised,
# since that one account signs in on every run (the default is 5 per hour).

name: Nightly promotion

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read

jobs:
  gate:
    name: Staging smoke and promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Staging configured?
        id: staging
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "STAGING_BASE_URL is not set; the nightly promotion stays manual until staging exists."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Anything to release?
        id: notes
        if: steps.staging.outputs.enabled == 'true'
        run: |
          git fetch --no-tags --depth=1 origin release || true
          git show origin/release:RELEASE_NOTES.md > /tmp/released-notes.md 2>/dev/null || : > /tmp/released-notes.md
          if python3 - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          import release_notes as rn
          head = rn.parse(rn.read("RELEASE_NOTES.md"))[0]
          # What is deployed may predate a rule the notes now follow.
          released = rn.parse(rn.read("/tmp/released-notes.md"), strict=False)[0] if open("/tmp/released-notes.md").read().strip() else []
          sys.exit(0 if [b for b in head if b not in released] else 1)
          EOF
          then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under Unreleased that release does not already carry; no nightly tonight."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Master CI is green
        if: steps.staging.outputs.enabled == 'true' && steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          not_green=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
            --jq '[.check_runs[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | map(.name) | join(", ")')
          if [ -n "$not_green" ]; then
            echo "Checks not green on master head: $not_green" >&2
            exit 1
          fi

      # Staging deploys from master (docs/railway.md), so the smoke run
      # exercises this very commit: the API answered, so its migrations
      # applied; the journey passed, so the build works end to end.
      #
      # "This very commit" has to be checked, not assumed. Waiting for the
      # API to merely answer would accept a staging box still running last
      # week's build and promote a commit nothing ever tested, so both
      # services are asked which commit they are and both must say this one.
      # They are separate Railway builds that finish at different times,
      # hence both.
      #
      # The API is asked at /api/v1/public/build, not /health: this URL is the
      # FRONTEND's origin, and the frontend answers /health itself
      # (frontend/nginx.conf) while proxying only /api/, so the API's own
      # /health is unreachable from here.
      - name: Staging runs this commit
        if: steps.staging.outputs.enabled == 'true' && steps.notes.outputs.release == 'true'
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          SHA: ${{ github.sha }}
        run: |
          probe() {
            curl -fsS --max-time 20 "$STAGING_BASE_URL$1" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true
          }
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            api=$(probe /api/v1/public/build)
            web=$(probe /build.json)
            if [ "$api" = "$SHA" ] && [ "$web" = "$SHA" ]; then
              echo "Staging is running $SHA; expecting notes version $(python3 scripts/release_notes.py version RELEASE_NOTES.md)"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Staging did not reach $SHA within 15 minutes (api=${api:-unknown}, frontend=${web:-unknown}); not promoting."
              exit 1
            fi
            sleep 15
          done

      - uses: actions/setup-node@v4
        if: steps.staging.outputs.enabled == 'true' && steps.notes.outputs.release == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Smoke test staging
        if: steps.staging.outputs.enabled == 'true' && steps.notes.outputs.release == 'true'
        working-directory: e2e
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/smoke.spec.ts --project=chromium

      - name: Promote
        if: steps.staging.outputs.enabled == 'true' && steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-release.yml --ref master
