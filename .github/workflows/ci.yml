name: CI

on:
  push:
    branches: [master]
  pull_request:

# Merges to master land in bursts, and a run for a commit that is no longer the
# head proves nothing anyone acts on: promotion reads the check runs of master's
# head commit, and nothing else consults an older commit's result. So a newer
# master push cancels the run it superseded rather than paying for it to finish.
#
# Only master cancels. A pull request keeps its runs to completion, because a
# PR's checks are what a reviewer reads on the PR itself, and cancelling those
# would leave a reviewer looking at a cancelled tick with no result behind it.
# A PR's group therefore carries its head SHA, giving every push a group of its
# own: without that, PR runs would share one group and — not being cancelled —
# would queue behind each other instead of running side by side.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.head.sha || 'head' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  backend:
    name: Backend (go vet + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: openv
          POSTGRES_PASSWORD: openv
          POSTGRES_DB: openv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Available for integration tests; current tests do not require a live DB.
      DATABASE_URL: postgres://openv:openv@localhost:5432/openv_test?sslmode=disable
      # Postgres-backed integration tests (PR #77) gate on this var and t.Skip when unset.
      OPENV_TEST_DATABASE_URL: postgres://openv:openv@localhost:5432/openv_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # go 1.25 — keep in sync automatically
          cache: true

      # Fail if any Go source is not gofmt-clean. Scoped to ./cmd ./internal
      # (gofmt takes directory paths, not the ./... pattern) so we never flag
      # the vendored Go package inside frontend/node_modules. Prints the
      # offending files before failing.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w ./cmd ./internal' to fix."
            exit 1
          fi

      # Scope to ./cmd/... ./internal/... — plain ./... would also sweep
      # frontend/node_modules/flatted/golang (a Go package that ships inside
      # an npm dependency) and fail.
      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      # CI=true makes CRA (react-scripts) treat eslint warnings (unused vars,
      # exhaustive-deps) as errors, so the build fails on any new warning.
      # Set explicitly to keep that strictness even if the runner default changes.
      - name: Build
        run: npm run build
        env:
          CI: "true"

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api .

      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.prod frontend

  # Boots the real compose stack (postgres + api + frontend) and runs the
  # Playwright smoke journey in e2e/ against it. Independent of the other
  # jobs so backend/frontend feedback stays fast.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build + start in the background while npm/Playwright set up below.
      - name: Build and start the compose stack
        run: docker compose up -d --build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for the API
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8080/health >/dev/null; do sleep 2; done'

      # The dev-compose frontend is the CRA dev server; it serves only after
      # the first compile, which dominates the wait.
      - name: Wait for the frontend
        run: timeout 420 bash -c 'until curl -fsS http://localhost:3000 >/dev/null; do sleep 3; done'

      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
