name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (go vet + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: openv
          POSTGRES_PASSWORD: openv
          POSTGRES_DB: openv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Available for integration tests; current tests do not require a live DB.
      DATABASE_URL: postgres://openv:openv@localhost:5432/openv_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # go 1.25 — keep in sync automatically
          cache: true

      # Scope to ./cmd/... ./internal/... — plain ./... would also sweep
      # frontend/node_modules/flatted/golang (a Go package that ships inside
      # an npm dependency) and fail.
      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      # CI=false: GitHub Actions sets CI=true, which makes CRA (react-scripts)
      # treat pre-existing eslint warnings (unused vars, exhaustive-deps) as
      # errors and fail the build. Verified 2026-08: build fails with CI=true,
      # succeeds with CI=false. Flip to CI=true once the lint warnings are fixed.
      - name: Build
        run: npm run build
        env:
          CI: "false"

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api .

      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.prod frontend
