services:
  postgres:
    image: postgres:15-alpine
    container_name: openv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: openv-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: openv
      PORT: 8080
      UPLOADS_DIR: /uploads
      OPENV_DATA_DIR: /data
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-worker-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Google sign-in: set these (e.g. in a .env file) to show the button.
      # Authorized redirect URI: ${PUBLIC_URL}/api/v1/auth/google/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Email notifications (issue #187) — strictly opt-in. Unset OPENV_SMTP_HOST
      # (the default) leaves email off; only in-app + SSE notifications deliver.
      # Set the SMTP_* vars to email high-signal notifications (failed runs,
      # proposals/reviews pending, budget alerts). Deep links use FRONTEND_URL.
      OPENV_SMTP_HOST: ${OPENV_SMTP_HOST:-}
      OPENV_SMTP_PORT: ${OPENV_SMTP_PORT:-587}
      OPENV_SMTP_USER: ${OPENV_SMTP_USER:-}
      OPENV_SMTP_PASSWORD: ${OPENV_SMTP_PASSWORD:-}
      OPENV_SMTP_FROM: ${OPENV_SMTP_FROM:-}
      # Optional override of which types email (comma-separated). Default:
      #   run_failed,proposal_pending,review_requested,budget_threshold
      OPENV_EMAIL_NOTIFICATION_TYPES: ${OPENV_EMAIL_NOTIFICATION_TYPES:-}
      # Hosted runners: the API provisions per-workspace runner containers on
      # the local docker daemon. Requires the docker socket volume below and
      # the openv-worker image (`make worker-image`). Set HOSTED_RUNNERS=off
      # to disable the feature entirely.
      HOSTED_RUNNERS: ${HOSTED_RUNNERS:-}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-openv-worker:latest}
      RUNNER_NETWORK: ${RUNNER_NETWORK:-}
      RUNNER_API_URL: ${RUNNER_API_URL:-http://api:8080}
      # Transient runners: members lease a pre-warmed runner from the pool
      # below instead of installing the connector. Set RUNNER_POOL_KEY on the
      # API and the pool to the same secret to turn the feature on; leaving it
      # unset disables it (no pool, nothing to lease).
      #   openssl rand -hex 32
      RUNNER_POOL_KEY: ${RUNNER_POOL_KEY:-}
      # Agent Connector downloads need no wiring: Dockerfile.api builds one
      # self-contained executable per OS into the image's ./dist, which is
      # the CONNECTOR_DIST_DIR default. Set CONNECTOR_DIST_DIR and mount a
      # host directory over it only to serve locally built ones instead
      # (`make connector-dist` fills ./dist on the host).
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/uploads
      - openv-data:/data
      # - /var/run/docker.sock:/var/run/docker.sock  # enable hosted runners (Linux hosts)
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # Transient runner pool. Each replica is a pre-warmed agentd that belongs to
  # nobody until a member leases it; it then serves that one member, and wipes
  # everything the lease wrote when it ends. Scale it to however many members
  # you expect to be running agents at once:
  #
  #   docker compose up -d --scale runner-pool=3
  #
  # No container_name (replicas need distinct names) and no volume (a pool
  # node's state is meant to be thrown away).
  runner-pool:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      OPENV_API_URL: ${RUNNER_API_URL:-http://api:8080}
      RUNNER_POOL_KEY: ${RUNNER_POOL_KEY:-}
      RUNNER_POOL: ${RUNNER_POOL:-default}
      # Leases get a HOME of their own under here, removed when they end.
      RUNNER_SESSION_ROOT: /data/sessions
      # Unset the image's hosted-runner default: a pool node is a member's own
      # runner for the length of a lease, and does sign their CLIs in.
      OPENV_HOSTED: ""
    depends_on:
      - api
    restart: on-failure
    profiles: ["runner-pool"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8080
    container_name: openv-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
  uploads_data:
  openv-data:
