# Browser-hardening headers for every response the frontend serves.
#
# nginx drops every inherited add_header the moment a location block adds one
# of its own, so a header declared once at server level silently disappears
# from any location that sets caching headers. This file is therefore
# included in the server block AND in each location that uses add_header;
# keep it that way when adding locations (see nginx.conf).
#
# __API_ORIGIN__ is replaced at image build time with REACT_APP_API_URL
# (frontend/Dockerfile.prod), the only origin the app talks to.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
