# Ignored when the master process runs unprivileged (USER nginx in
# Dockerfile.prod); kept for the case where the image is run as root.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Scheme the client used, as seen by the outermost proxy: Railway's edge
    # (or any TLS-terminating proxy) sets X-Forwarded-Proto; when nginx is
    # the outermost hop the header is absent and its own scheme is right.
    map $http_x_forwarded_proto $openv_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        # Cloud Run requires port 8080
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers. nginx discards inherited add_header directives in
        # any location that adds its own, so the same file is included again
        # in every location below that sets caching headers.
        include /etc/nginx/security-headers.conf;

        # Health check endpoint for Cloud Run
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            include /etc/nginx/security-headers.conf;
        }

        # The service worker and manifest must never be long-cached, or
        # installed apps keep running a stale worker/manifest for a year.
        # Exact matches take precedence over the regex cache block below.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
        location = /manifest.json {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # The API, proxied on the same origin so the browser's session cookie
        # is first-party (a cross-site cookie is blocked by Safari/iOS). The
        # upstream address and resolver come from the file the entrypoint
        # script writes at container start (see docker-entrypoint.d/). `^~`
        # keeps the regex locations below from claiming API paths that end
        # in an asset extension (attachments, exports).
        location ^~ /api/ {
            include /etc/nginx/openv/api-proxy.conf;
            proxy_pass $openv_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $openv_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            # Server-sent events (runs, notifications, guided chat) and file
            # downloads stream through unbuffered; an idle stream may sit for
            # a long time between events.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            # No cap here: the API is what bounds a request body, and it is
            # the only hop that can. This number used to mirror the API's JSON
            # limit (OPENV_MAX_BODY_MB, 32 MB), which was right until issue
            # #364 exempted file uploads from that limit so a figure could be
            # as large as the workspace's plan allows — 128 MB free, 512 MB on
            # Business Lite, 1 GB on Business, 200 MB for an evidence file.
            # This line was not raised with it, so nginx went on refusing
            # anything over 32 MB with a 413 of its own and the API never saw
            # the request: the plan ceilings were unreachable and the fix for
            # #364 was masked at the edge.
            #
            # Delegating rather than picking a bigger number is deliberate. A
            # ceiling written here is a second copy of a limit that lives in
            # the plan table, and the last copy went stale the moment the
            # table changed. Nothing is unbounded as a result: every JSON
            # route is still held to OPENV_MAX_BODY_MB by BodyLimitMiddleware,
            # and every multipart handler sets its own MaxBytesReader before
            # it parses a byte (UploadAttachment, UploadAttachmentVersion,
            # UploadEvidenceFile, UploadAvatar, UploadOrgLogo). With
            # proxy_request_buffering off, nginx streams the body straight to
            # the API instead of spooling it, so it is the API that decides
            # how far a body gets to run.
            client_max_body_size 0;
            # API responses carry the API's own security headers (including
            # the sandboxing ones on attachments), so the frontend's set is
            # not layered on top; this one add_header exists only to stop
            # nginx inheriting the server-level headers into this location.
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Share links and open-source project links (REQ-149, REQ-151) go
        # to the API's own page for them first: it carries the Open Graph
        # tags a link unfurler (Slack, Discord, LinkedIn, ...) reads, and
        # sends a browser on into the app. Unfurlers never run the app, so
        # the SPA's index.html would preview as nothing.
        location ^~ /share/ {
            rewrite ^/share/([A-Za-z0-9]+)/?$ /api/v1/public/share/$1/page break;
            include /etc/nginx/openv/api-proxy.conf;
            proxy_pass $openv_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $openv_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ^~ /open-source/p/ {
            rewrite ^/open-source/p/([A-Za-z0-9-]+)/?$ /api/v1/public/open-source/projects/$1/page break;
            include /etc/nginx/openv/api-proxy.conf;
            proxy_pass $openv_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $openv_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Static assets caching
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # SPA routing - all routes fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            include /etc/nginx/security-headers.conf;
        }

        # Prevent access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
