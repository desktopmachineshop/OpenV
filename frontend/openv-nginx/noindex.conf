# Build-time default: indexable, exactly as the shared instance wants to be.
# 45-openv-noindex.sh rewrites this file at container start when OPENV_NOINDEX
# is set, adding the X-Robots-Tag that keeps a non-production copy of the app
# (staging) out of search results. Included from security-headers.conf, which
# is itself included in every location, because nginx discards inherited
# add_header directives in any location that adds one of its own.
