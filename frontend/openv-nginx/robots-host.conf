# Build-time default: no host name is singled out for noindex, which is what a
# deployment without OPENV_SITE_URL gets. 46-openv-crawl.sh rewrites this file
# at container start; with OPENV_SITE_URL set, every host name but the site's
# own maps to "noindex, nofollow". Included at http level by nginx.conf, where
# a map must sit; security-headers.conf sends the header it yields.
map $host $openv_host_robots {
    default "";
}
