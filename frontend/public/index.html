<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2c3e50" />
    <meta name="description" content="OpenV - Verification & Validation Requirements Management Platform" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>OpenV</title>
    <script>
        // Apply the stored theme preference before first paint to avoid a
        // flash of the wrong theme. Keep the storage key in sync with
        // src/theme.ts (THEME_STORAGE_KEY).
        (function () {
            try {
                var t = localStorage.getItem('openv-theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* localStorage unavailable — system theme applies */ }
        })();
    </script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
