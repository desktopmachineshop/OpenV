<div style="padding: 24px; max-width: 700px; margin: 0px auto;">
<div style="text-align: center; padding: 40px;" class="card">
<div style="font-size: 40px; margin-bottom: 10px;">✓</div>
<h2 style="color: var(--success); margin-bottom: 12px;">Requirements committed</h2>
<p style="color: var(--text-muted); margin-bottom: 24px;">All draft artifacts are now live. You can baseline this initial set to keep an immutable snapshot for traceability.</p>
<div role="alert" style="display: flex; align-items: flex-start; gap: 10px; background: var(--tint-red); border: 1px solid var(--tint-red-border); color: var(--danger-strong); border-radius: 4px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px;">
<span style="flex: 1 1 0%; line-height: 1.5; overflow-wrap: anywhere;">Failed to create baseline: a baseline needs a requirement</span>
<button aria-label="Dismiss error" title="Dismiss" style="background: none; border: medium; cursor: pointer; color: var(--danger-strong); font-size: 18px; line-height: 1; padding: 0px; width: 32px; min-height: 32px; margin: -6px -8px -6px 0px; flex-shrink: 0;">×</button>

<div style="display: flex; gap: 12px; justify-content: center;">
<button class="button">Create baseline</button>
<a class="button-secondary" style="text-decoration: none;" href="/projects/p1/requirements" data-discover="true">Go to Requirements</a>
<button class="button-secondary">Modify guided definition</button>
</div>
</div>
