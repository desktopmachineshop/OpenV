<button role="tab" id="project-settings-tab-general" aria-selected="false" aria-controls="project-settings-panel" data-help-pane="settings.general" class="ov-settings-nav-item" style="font-weight: 400;">General</button>
<button role="tab" id="project-settings-tab-members" aria-selected="false" aria-controls="project-settings-panel" data-help-pane="settings.members" class="ov-settings-nav-item" style="font-weight: 400;">Access</button>
<button role="tab" id="project-settings-tab-repos" aria-selected="false" aria-controls="project-settings-panel" data-help-pane="settings.repos" class="ov-settings-nav-item" style="font-weight: 400;">Repositories</button>
<button role="tab" id="project-settings-tab-agents" aria-selected="false" aria-controls="project-settings-panel" data-help-pane="settings.agents" class="ov-settings-nav-item" style="font-weight: 400;">Agents</button>
<button role="tab" id="project-settings-tab-attributes" aria-selected="false" aria-controls="project-settings-panel" data-help-pane="settings.attributes" class="ov-settings-nav-item" style="font-weight: 400;">Attributes</button>
<button role="tab" id="project-settings-tab-quality" aria-selected="false" aria-controls="project-settings-panel" data-help-pane="settings.quality" class="ov-settings-nav-item" style="font-weight: 400;">Quality rules</button>
<button role="tab" id="project-settings-tab-danger" aria-selected="true" aria-controls="project-settings-panel" data-help-pane="settings.danger" class="ov-settings-nav-item is-danger" style="font-weight: 600;">Danger Zone</button>
</div>

<div class="ov-settings-main">
<div class="ov-settings-head">
<span class="ov-page-sub">Project settings</span>
<h2>Danger Zone</h2>
<p>Actions that cannot be undone.</p>
</div>
<div role="tabpanel" id="project-settings-panel" aria-labelledby="project-settings-tab-danger" data-help-pane="settings.danger">
<div class="card" style="border: 1px solid var(--danger);" data-help-key="settings.danger">
<h3 style="color: var(--danger);">Danger zone</h3>
<p style="font-size: 13px; color: var(--text-muted);">Deleting the project permanently removes all artifacts, links, baselines, test runs, work items and interview data. This cannot be undone.</p>
<button style="background: var(--danger); color: rgb(255, 255, 255); border: medium; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; width: auto;">Delete this project</button>
</div>
</div>
</div>
</div>
