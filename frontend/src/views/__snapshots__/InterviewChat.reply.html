<div style="min-height: 100vh; background: var(--bg-app); display: flex; justify-content: center;">
<div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; height: 100vh;">
<header style="padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
<div style="min-width: 0px;">
<div style="font-weight: 700; color: var(--text); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Pump maintenance</div>
<div style="font-size: 12px; color: var(--text-muted);">Interviewing Pat</div>
</div>
<button style="background: none; border: 1px solid var(--danger); color: var(--danger); border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; width: auto; white-space: nowrap;">End interview</button>
</header>
<div style="flex: 1 1 0%; overflow-y: auto; padding: 16px;">
<div style="display: flex; justify-content: flex-start; margin-bottom: 10px;">
<div style="max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: normal; word-break: break-word; background: var(--surface-alt); color: var(--text); border-bottom-right-radius: 14px; border-bottom-left-radius: 4px;">
<div class="markdown-content chat-markdown">
<p>Hi Pat! I'd like to learn how your team looks after the <strong>coolant pumps</strong>.<br>
What does a normal week look like?</p>
</div>
</div>
</div>
<div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
<div style="max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; border-bottom-left-radius: 14px;">We check them every Monday.</div>
</div>
<div style="display: flex; justify-content: flex-start; margin-bottom: 10px;">
<div style="max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: normal; word-break: break-word; background: var(--surface-alt); color: var(--text); border-bottom-right-radius: 14px; border-bottom-left-radius: 4px;">
<div class="markdown-content chat-markdown">
<p>Thanks, Pat. <strong>Who</strong> signs the check off?</p>
</div>
</div>
</div>
<div>
</div>
</div>
<div style="background: var(--surface); border-top: 1px solid var(--border); padding: 12px;">
<div style="display: flex; gap: 8px; align-items: flex-end;">
<textarea placeholder="Type your answer… (Ctrl+Enter to send)" enterkeyhint="enter" rows="2" style="flex: 1 1 0%; min-height: 44px; resize: none; font-size: 14px;">
</textarea>
<button class="button" style="background: var(--accent); opacity: 0.5; white-space: nowrap;" disabled="">Send</button>
</div>
</div>
</div>
</div>
<!-- control 1: textarea = "" -->
<!-- focus: body -->
