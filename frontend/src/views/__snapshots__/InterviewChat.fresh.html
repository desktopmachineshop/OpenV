<div style="min-height: 100vh; background: var(--bg-app); display: flex; justify-content: center;">
<div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; height: 100vh;">
<header style="padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
<div style="min-width: 0px;">
<div style="font-weight: 700; color: var(--text); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Pump maintenance</div>
<div style="font-size: 12px; color: var(--text-muted);">Interviewing Pat Lee</div>
</div>
<button style="background: none; border: 1px solid var(--danger); color: var(--danger); border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; width: auto; white-space: nowrap;">End interview</button>
</header>
<div style="flex: 1 1 0%; overflow-y: auto; padding: 16px;">
<div style="text-align: center; color: var(--neutral); font-size: 13px; margin-top: 30px;">Say hello to get started — the interviewer will guide the conversation.</div>
<div>
</div>
</div>
<div style="background: var(--surface); border-top: 1px solid var(--border); padding: 12px;">
<div style="display: flex; gap: 8px; align-items: flex-end;">
<textarea placeholder="Type your answer… (Ctrl+Enter to send)" enterkeyhint="enter" rows="2" style="flex: 1 1 0%; min-height: 44px; resize: none; font-size: 14px;">
</textarea>
<button class="button" disabled="" style="background: var(--accent); opacity: 0.5; white-space: nowrap;">Send</button>
</div>
</div>
</div>
</div>
